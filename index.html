(function(){
const KEY='elo_marketing_v1';
const DEFAULT_CFG={daily:{contacts:13,convs:4,meetings:1},decMrr:4300,end:'2026-11-30',goal:17000,holidays:['2026-11-20'],levels:[{impl:1500,monthly:600,n:'Essencial',qty:3},{impl:3000,monthly:1000,n:'Crescimento',qty:1},{impl:6000,monthly:1500,n:'Sistema sob medida',qty:1}],start:'2026-11-03',targets:{contacts:240,convs:72,meetings:18,sales:5},weekly:[{cum:4200,until:'2026-11-06'},{cum:8200,until:'2026-11-13'},{cum:15700,until:'2026-11-20'},{cum:17800,until:'2026-11-30'}]};
let store={};try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){store={}}
if(!store.config||!store.config.main){store.config={main:DEFAULT_CFG};try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
window.__eloStore={get:()=>store,set:s=>{store=s;persist()}};
const subs={};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){alert('Não foi possível salvar no navegador. Baixe um backup.')}};
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const dsnap=(col,id)=>{const d=(store[col]||{})[id];return{id,exists:d!==undefined,data:()=>d===undefined?undefined:clone(d)}};
const notify=col=>(subs[col]||new Set()).forEach(f=>f());
const ref=(col,id)=>({id,
 set:async d=>{(store[col]=store[col]||{})[id]=clone(d);persist();notify(col)},
 update:async d=>{const c=(store[col]=store[col]||{});c[id]={...(c[id]||{}),...clone(d)};persist();notify(col)},
 delete:async()=>{if(store[col])delete store[col][id];persist();notify(col)},
 get:async()=>dsnap(col,id),
 onSnapshot(next){const f=()=>next(dsnap(col,id));(subs[col]=subs[col]||new Set()).add(f);setTimeout(f,0);return()=>subs[col].delete(f)}});
const db={collection:col=>({
 doc:id=>ref(col,id||nid()),
 add:async d=>{const r=ref(col,nid());await r.set(d);return r},
 onSnapshot(next){const f=()=>next({docs:Object.keys(store[col]||{}).map(id=>dsnap(col,id))});(subs[col]=subs[col]||new Set()).add(f);setTimeout(f,0);return()=>subs[col].delete(f)}})};
const downloads={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
window.claude={use:async n=>n==='db'?db:n==='downloads'?downloads:null};
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
})();
</script>

<script>
const $=s=>document.querySelector(s),GOAL=17000;
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const tz=()=>new Date().toLocaleDateString('sv'),D=d=>d?d.split('-').reverse().join('/'):'—';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=[['impl','Implementation'],['sub','Monthly subscription']],CN=Object.fromEntries(CATS);
const METH=['Pix','Bank transfer','Credit card','Cash','Other'].map(x=>[x,x]);
let S=[],P=[],E=[],db=null,ready=false,tab='dash',per='month',cf='',ct='',pf='open',cur=null;
const TABS=[['dash','Dashboard'],['sales','Sales'],['pay','Payments'],['rep','Reports'],['aud','Audit trail']];
$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="btn" data-a="tab" data-i="${k}">${l}</button>`).join('');
(async()=>{try{db=await Promise.race([window.claude.use('db'),new Promise(r=>setTimeout(()=>r(null),10000))])}catch(e){db=null}
ready=true;if(db){const sub=(n,f)=>db.collection(n).onSnapshot(s=>{f(s.docs.map(d=>({...d.data(),id:d.id})));render()},e=>console.error(e));
sub('sales',x=>S=x);sub('payments',x=>P=x);sub('events',x=>E=x)}render()})();

/* ---------- accounting core ---------- */
const sale=id=>S.find(s=>s.id===id),saleOk=id=>{const s=sale(id);return !!s&&s.status!=='cancelled'};
const cust=p=>(sale(p.saleId)||{}).customer||'—',plan=p=>(sale(p.saleId)||{}).plan||'—';
const live=p=>p.status!=='cancelled';
const paid=p=>live(p)?(p.receipts||[]).reduce((a,r)=>a+r.amount,0):0;
const rem=p=>!live(p)||!saleOk(p.saleId)?0:Math.max(0,Math.round((p.amount-paid(p))*100)/100);
const stat=p=>{if(!live(p))return['cancelled','Cancelled'];const r=rem(p),pd=paid(p);
 if(!saleOk(p.saleId)&&r===0)return['cancelled',pd>0?'Closed (sale cancelled)':'Cancelled'];
 if(r<=0)return['paid','Paid'];const od=p.due<tz();
 if(pd>0)return od?['overdue','Partial · overdue']:['partial','Partially paid'];return od?['overdue','Overdue']:['pending','Pending']};
const mr=o=>{const d=new Date(),f=x=>x.toLocaleDateString('sv');return[f(new Date(d.getFullYear(),d.getMonth()-o,1)),f(new Date(d.getFullYear(),d.getMonth()-o+1,0))]};
const rng=()=>{const t=tz();if(per==='today')return[t,t];if(per==='week'){const a=new Date();a.setDate(a.getDate()-(a.getDay()+6)%7);const b=new Date(a);b.setDate(a.getDate()+6);return[a.toLocaleDateString('sv'),b.toLocaleDateString('sv')]}
 if(per==='custom')return[cf||'0000-01-01',ct||'9999-12-31'];return mr(0)};
const inR=(d,r)=>d>=r[0]&&d<=r[1];
const M=r=>{const m={cash:0,impl:0,sub:0,rc:[],sales:S.filter(s=>s.status!=='cancelled'&&inR(s.date,r))};
 P.filter(live).forEach(p=>(p.receipts||[]).forEach(x=>{if(inR(x.date,r)){m.cash+=x.amount;m[p.cat==='impl'?'impl':'sub']+=x.amount;m.rc.push({...x,p})}}));
 m.contracted=m.sales.reduce((a,s)=>a+s.impl+s.monthly,0);m.n=m.sales.length;m.avg=m.n?m.contracted/m.n:0;return m};
const open=()=>{let pend=0,od=0;P.forEach(p=>{const r=rem(p);if(r)(p.due<tz()?od+=r:pend+=r)});return{pend,od}};
const mrr=()=>S.filter(s=>s.status!=='cancelled').reduce((a,s)=>a+s.monthly,0);
const saleFin=s=>{const ps=P.filter(p=>p.saleId===s.id&&live(p));let rc=0,pe=0,od=0;ps.forEach(p=>{rc+=paid(p);const r=rem(p);if(r)(p.due<tz()?od+=r:pe+=r)});return{rc,pe,od}};

/* ---------- UI helpers ---------- */
const tbl=(h,rows,rc=[])=>`<div class="wrap card" style="padding:0"><table><tr>${h.map((x,i)=>`<th class="${rc.includes(i)?'r':''}">${x}</th>`).join('')}</tr>${rows.length?rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${rc.includes(i)?'r':''}">${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="sub">No records yet.</td></tr>`}</table></div>`;
const tag=p=>{const[c,l]=stat(p);return`<span class="tag ${c}">${l}</span>`};
const KM={'Implementation received':['🛠️','--cy'],'Subscription received':['🔁','--pk'],'Contracted MRR (active)':['📈','--g2'],'Pending payments':['⏳','--wa'],'Overdue payments':['🚨','--er'],'Contracts closed':['🤝','--ok'],'Average contract value':['💎','--pri'],'Sales closed':['🤝','--ok'],'Payments received':['💰','--ok'],'Implementation revenue':['🛠️','--cy'],'Subscription revenue':['🔁','--pk'],'Recurring revenue (MRR)':['📈','--g2'],'Outstanding receivables':['⏳','--wa']};
const kpi=(l,v,c='')=>{const[i,k]=KM[l]||['📊','--pri'];return`<div class="card kpi" style="--c:var(${k})"><div class="ic">${i}</div><div><h4>${l}</h4><div class="k ${c}">${v}</div></div></div>`};
const goal=(t,v,c,s)=>{const pc=Math.round(v/GOAL*100);return`<div class="card goal ${c}"><h4>${c==='g1'?'':''}${t}</h4><div class="num">${R(v)} <small>/ ${R(GOAL)}</small></div><div class="bar"><i class="${c}" style="width:${Math.min(100,pc)}%"></i></div><div class="sub"><b>${pc}%</b> · ${v>=GOAL?'Goal reached':'Remaining '+R(GOAL-v)}<br>${s}</div></div>`};
const fld=(k,l,t='text',v='',o)=>`<label>${l}${o?`<select name="${k}">${o.map(([a,b])=>`<option value="${esc(a)}"${a==v?' selected':''}>${esc(b)}</option>`).join('')}</select>`:`<input name="${k}" type="${t}" value="${esc(v)}"${t==='number'?' step="0.01" min="0"':''}>`}</label>`;
const modal=(title,body,fn,extra='')=>{cur=fn;$('#dlg').innerHTML=`<h3 style="margin-top:0">${title}</h3><div class="fm">${body}</div>${extra}<p id="err" class="neg"></p><div class="row"><button class="btn" data-a="x">Close</button>${fn?'<button class="btn pri" data-a="ok">Save</button>':''}</div>`;$('#dlg').showModal()};
const log=(ent,id,act,sum)=>db.collection('events').add({ts:Date.now(),ent,eid:id,act,sum});
const put=(col,id,o)=>{const{id:_,...r}=o;return db.collection(col).doc(id).set(r)};
const nid=col=>db.collection(col).doc().id;
const addM=(d,i)=>{const[y,m,dd]=d.split('-').map(Number),t=new Date(y,m-1+i,1),l=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(dd,l));return t.toLocaleDateString('sv')};
const grp=(rows,key)=>{const g={};rows.forEach(r=>{const k=key(r.s);(g[k]=g[k]||{c:0,rc:0,pe:0})});return g};

/* ---------- views ---------- */
const V={
dash(){const r=mr(0),m=M(r),o=open(),od=P.filter(p=>rem(p)&&p.due<tz()).sort((a,b)=>a.due>b.due?1:-1).slice(0,8);
 const months=[5,4,3,2,1,0].map(i=>{const rr=mr(i),x=M(rr);return{l:new Date(rr[0]+'T00:00').toLocaleDateString('pt-BR',{month:'short'}),c:x.cash,k:x.contracted}});
 const mx=Math.max(GOAL,...months.map(x=>Math.max(x.c,x.k)));
 return`<div class="goals">${goal('Cash received this month',m.cash,'g1','Primary goal · only confirmed payments')}${goal('Contracted revenue this month',m.contracted,'g2','Secondary goal · first-month total of closed contracts')}</div>
<div class="grid">${kpi('Implementation received',R(m.impl))}${kpi('Subscription received',R(m.sub))}${kpi('Contracted MRR (active)',R(mrr()))}${kpi('Pending payments',R(o.pend),'pending')}${kpi('Overdue payments',R(o.od),o.od?'overdue':'')}${kpi('Contracts closed',m.n)}${kpi('Average contract value',R(m.avg))}</div>
<h3>Last 6 months <span class="sub">· <b style="color:var(--ok)">■</b> cash received <b style="color:var(--g2)">■</b> contracted</span></h3>
<div class="card chart">${months.map(x=>`<div class="m"><div class="bs"><i class="g1" style="height:${x.c/mx*100}%" title="${R(x.c)}"></i><i class="g2" style="height:${x.k/mx*100}%" title="${R(x.k)}"></i></div>${x.l}</div>`).join('')}</div>
<h3>Overdue</h3>${tbl(['Due','Customer','Category','Balance',''],od.map(p=>[D(p.due),esc(cust(p)),CN[p.cat],R(rem(p)),`<button class="btn sm" data-a="rcv" data-i="${p.id}">Receive</button>`]),[3])}`},
sales(){return`<div class="row" style="margin:0 0 10px"><button class="btn pri" data-a="newSale">+ New sale</button></div>`+tbl(['Closed','Customer','Plan','Implementation','Subscription (MRR)','First month','Received','Pending','Overdue','Status',''],
 [...S].sort((a,b)=>a.date<b.date?1:-1).map(s=>{const f=saleFin(s);return[D(s.date),esc(s.customer),esc(s.plan),R(s.impl),R(s.monthly),R(s.impl+s.monthly),R(f.rc),R(f.pe),R(f.od),s.status==='cancelled'?'<span class="tag cancelled">Cancelled</span>':'Active',`<button class="btn sm" data-a="addPay" data-i="${s.id}">+ Payment</button> <button class="btn sm" data-a="editSale" data-i="${s.id}">Edit</button>`]}),[3,4,5,6,7,8])},

 return`<div class="row" style="margin:0 0 10px">${[['open','Open'],['overdue','Overdue'],['paid','Paid'],['cancelled','Cancelled'],['all','All']].map(([k,l])=>`<button class="btn ${pf===k?'on':''}" data-a="pf" data-i="${k}">${l}</button>`).join('')}</div>`+
 tbl(['Due','Customer','Category','Amount','Received','Balance','Last received','Method','Status',''],[...P].filter(f).sort((a,b)=>a.due>b.due?1:-1).map(p=>{const rc=p.receipts||[],l=rc[rc.length-1];return[D(p.due),esc(cust(p)),CN[p.cat],R(p.amount),R(paid(p)),R(rem(p)),l?D(l.date):'—',l?esc(l.method):'—',tag(p),(rem(p)?`<button class="btn sm" data-a="rcv" data-i="${p.id}">Receive</button> `:'')+`<button class="btn sm" data-a="editPay" data-i="${p.id}">Edit</button>`]}),[3,4,5])},
rep(){const r=rng(),m=M(r),cs=grp(S.map(s=>({s})),s=>s.customer),ps=grp(S.map(s=>({s})),s=>s.plan||'—');
 const c2={},p2={};
 m.sales.forEach(s=>{(c2[s.customer]=c2[s.customer]||{c:0,rc:0,pe:0}).c+=s.impl+s.monthly;(p2[s.plan||'—']=p2[s.plan||'—']||{c:0,rc:0,pe:0}).c+=s.impl+s.monthly});

 const gt=g=>tbl(['Name','Contracted (period)','Received (period)','Outstanding (today)'],Object.entries(g).sort((a,b)=>b[1].rc-a[1].rc).map(([k,v])=>[esc(k),R(v.c),R(v.rc),R(v.pe)]),[1,2,3]);

 return`<div class="row" style="margin:0 0 10px">${[['today','Today'],['week','This week'],['month','This month'],['custom','Custom']].map(([k,l])=>`<button class="btn ${per===k?'on':''}" data-a="per" data-i="${k}">${l}</button>`).join('')}
${per==='custom'?`<input type="date" id="cf" value="${cf}" style="width:auto"> – <input type="date" id="ct" value="${ct}" style="width:auto">`:''}<span class="sub">${D(r[0])} – ${D(r[1])}</span></div>
<div class="grid">${kpi('Sales closed',m.n+' · '+R(m.contracted))}${kpi('Payments received',R(m.cash),'paid')}${kpi('Implementation revenue',R(m.impl))}${kpi('Subscription revenue',R(m.sub))}${kpi('Recurring revenue (MRR)',R(mrr()))}${kpi('Outstanding receivables',R(open().pend+open().od),'pending')}</div>
<h3>Sales closed</h3>${tbl(['Date','Customer','Plan','Implementation','Subscription','First month'],m.sales.map(s=>[D(s.date),esc(s.customer),esc(s.plan),R(s.impl),R(s.monthly),R(s.impl+s.monthly)]),[3,4,5])}

function render(){document.querySelectorAll('#nav .btn').forEach(b=>b.classList.toggle('on',b.dataset.i===tab));

/* ---------- actions ---------- */
const act={tab:i=>{tab=i;render()},per:i=>{per=i;render()},pf:i=>{pf=i;render()},x:()=>$('#dlg').close(),
ok:async()=>{const v={};$('#dlg').querySelectorAll('[name]').forEach(i=>v[i.name]=i.value);let e;try{e=await cur(v)}catch(x){e='Could not save: '+(x.message||x.code||'permission denied')}if(e)$('#err').textContent=e;else $('#dlg').close()},
newSale:()=>modal('New sale',saleF()+fld('inst','Implementation installments','number',1)+fld('idue','First implementation due date','date',tz())+fld('months','Subscription months to schedule','number',12)+fld('sdue','First subscription due date','date',tz()),async v=>{
 const e=chk(v);if(e)return e;const id=nid('sales'),impl=+v.impl||0,mo=+v.monthly||0;
 await put('sales',id,{customer:v.customer.trim(),plan:v.plan.trim(),date:v.date,impl,monthly:mo,notes:v.notes,segment:v.segment||'',status:'active'});
 await log('sale',id,'created',`${v.customer} · implementation ${R(impl)} · subscription ${R(mo)}`);
 const mk=async(cat,amt,due,notes)=>{const pid=nid('payments');await put('payments',pid,{saleId:id,cat,amount:amt,due,receipts:[],status:'active',notes});await log('payment',pid,'scheduled',`${v.customer} · ${CN[cat]} ${R(amt)} due ${D(due)}`)};
 if(impl>0){const n=Math.max(1,parseInt(v.inst)||1),c=Math.round(impl*100);for(let i=0;i<n;i++){const a=(i<n-1?Math.floor(c/n):c-Math.floor(c/n)*(n-1))/100;await mk('impl',a,addM(v.idue||v.date,i),n>1?`Installment ${i+1}/${n}`:'')}}
 if(mo>0){const n=Math.max(1,parseInt(v.months)||1);for(let i=0;i<n;i++)await mk('sub',mo,addM(v.sdue||v.date,i),`Month ${i+1}/${n}`)}}),
editSale:id=>{const s=sale(id);modal('Edit sale',saleF(s),async v=>{const e=chk(v);if(e)return e;const o={...s,customer:v.customer.trim(),plan:v.plan.trim(),date:v.date,impl:+v.impl||0,monthly:+v.monthly||0,notes:v.notes,segment:v.segment||''};
 await put('sales',id,o);await log('sale',id,'edited',`${s.customer}: first month ${R(s.impl+s.monthly)} → ${R(o.impl+o.monthly)}`)},
 `<div class="row"><button class="btn sm" data-a="togSale" data-i="${id}">${s.status==='cancelled'?'Reactivate sale':'Cancel sale'}</button><span class="sub">Cancelling removes the sale from contracted revenue and zeroes unpaid balances. Money already received stays recorded.</span></div>`)},

addPay:sid=>{const s=sale(sid);modal('Add payment — '+esc(s.customer),fld('cat','Category','text','impl',CATS)+fld('amount','Amount (R$)','number')+fld('due','Due date','date',tz())+fld('notes','Notes'),async v=>{
 if(!(+v.amount>0))return'Enter an amount.';if(!v.due)return'Enter a due date.';const pid=nid('payments');
 await put('payments',pid,{saleId:sid,cat:v.cat,amount:+v.amount,due:v.due,receipts:[],status:'active',notes:v.notes});await log('payment',pid,'created',`${s.customer} · ${CN[v.cat]} ${R(+v.amount)} due ${D(v.due)}`)})},
rcv:id=>{const p=P.find(x=>x.id===id);modal(`Register receipt — ${esc(cust(p))}`,`<div class="sub">${CN[p.cat]} · due ${D(p.due)} · balance ${R(rem(p))}</div>`+fld('date','Date received','date',tz())+fld('amount','Amount received (R$)','number',rem(p))+fld('method','Method','text','Pix',METH),async v=>{
 const a=Math.round(+v.amount*100)/100;if(!(a>0))return'Enter the amount received.';if(!v.date)return'Enter the date.';if(a>rem(p)+0.001)return`Amount exceeds the balance (${R(rem(p))}).`;
 const o={...p,receipts:[...(p.receipts||[]),{id:nid('x'),date:v.date,amount:a,method:v.method}]};
 await put('payments',id,o);await log('payment',id,'receipt',`${cust(p)} · ${R(a)} via ${v.method} on ${D(v.date)} (${rem(p)-a>0.001?'partial':'paid in full'})`)})},
editPay:id=>{const p=P.find(x=>x.id===id),ev=E.filter(e=>e.eid===id).sort((a,b)=>b.ts-a.ts);
 modal('Payment — '+esc(cust(p)),fld('cat','Category','text',p.cat,CATS)+fld('amount','Amount (R$)','number',p.amount)+fld('due','Due date','date',p.due)+fld('notes','Notes','text',p.notes||''),async v=>{
 if(!(+v.amount>0))return'Enter an amount.';if(+v.amount<(p.receipts||[]).reduce((a,r)=>a+r.amount,0)-0.001)return'Amount cannot be below what was already received.';
 const o={...p,cat:v.cat,amount:+v.amount,due:v.due,notes:v.notes},ch=[];if(o.cat!==p.cat)ch.push(`category ${CN[p.cat]} → ${CN[o.cat]}`);if(o.amount!==p.amount)ch.push(`amount ${R(p.amount)} → ${R(o.amount)}`);if(o.due!==p.due)ch.push(`due ${D(p.due)} → ${D(o.due)}`);if(o.notes!==(p.notes||''))ch.push('notes changed');

 `<h4 style="margin-top:12px">Receipts</h4>${(p.receipts||[]).map(r=>`<div class="ev">${D(r.date)} · ${R(r.amount)} · ${esc(r.method)} <button class="btn sm" data-a="delR" data-i="${id}|${r.id}">Remove</button></div>`).join('')||'<div class="sub">None</div>'}
 <div class="row"><button class="btn sm" data-a="togP" data-i="${id}">${live(p)?'Cancel payment':'Reactivate payment'}</button></div>

const saleF=(s={})=>fld('customer','Customer','text',s.customer||'')+fld('plan','Nível','text',s.plan||'',lvOpts())+fld('segment','Segmento','text',s.segment||'')+fld('date','Closing date','date',s.date||tz())+fld('impl','Implementation fee (R$)','number',s.impl||'')+fld('monthly','Monthly subscription (R$)','number',s.monthly||'')+fld('notes','Notes','text',s.notes||'');
const chk=v=>!v.customer.trim()?'Enter the customer.':!v.date?'Enter the closing date.':!((+v.impl||0)+(+v.monthly||0)>0)?'Enter an implementation fee and/or a subscription.':null;

function ritmo(){if(!CFG)return noCfg;const t=tz(),s=t<CFG.start?CFG.start:t>CFG.end?CFG.end:t,meta=metaAt(s),real=cumC(s),d=real-meta,
 st=d>=0?['paid','Adiantado']:real>=meta*.9?['pending','Quase no ritmo']:['overdue','Atrás da meta'];
 return`<h3>Ritmo da meta</h3><div class="grid">${kpi('Meta acumulada hoje',R(meta))}${kpi('Contratado acumulado',R(real))}${kpi('Falta para a meta',R(Math.max(0,goalV()-cumC(CFG.end))))}${kpi('Situação',st[1],st[0])}${kpi('Recorrência planejada (dez/26)',R(CFG.decMrr||0))}</div>`}

function chart(){if(!CFG)return'';const t=tz(),a=pdt(CFG.start),n=Math.round((pdt(CFG.end)-a)/864e5),W=760,H=310,pl=60,pr=22,pt=22,pb=36,iw=W-pl-pr,ih=H-pt-pb;
 const dd=i=>{const d=new Date(a);d.setDate(a.getDate()+i);return ds(d)},tod=Math.min(n,Math.max(0,Math.round((pdt(t)-a)/864e5)));
 const rows=[...Array(n+1).keys()].map(i=>{const s=dd(i);return{s,m:metaAt(s),c:i<=tod?cumC(s):0,r:i<=tod?cumCash(s):0}});
 const mx=Math.max(goalV()*1.1,...rows.map(r=>Math.max(r.m,r.c,r.r))),x=i=>pl+iw*i/n,y=v=>pt+ih*(1-v/mx);
 const ln=(k,m)=>rows.slice(0,m+1).map((r,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(r[k]).toFixed(1)}`).join(''),ar=k=>ln(k,tod)+`L${x(tod)},${y(0)}L${x(0)},${y(0)}Z`;
 const kf=v=>'R$ '+(v/1000).toFixed(1).replace('.0','').replace('.',',')+'k',lab=(k,c,dy)=>`<circle cx="${x(tod)}" cy="${y(rows[tod][k])}" r="5.5" fill="${c}" stroke="#fff" stroke-width="2"/><text x="${x(tod)}" y="${y(rows[tod][k])+dy}" text-anchor="${tod>n*.8?'end':'middle'}" font-size="12" font-weight="700" fill="${c}">${R(rows[tod][k])}</text>`;
 const grid=[0,.25,.5,.75,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${y(goalV()*f)}" y2="${y(goalV()*f)}" stroke="var(--bd)"/><text x="${pl-8}" y="${y(goalV()*f)+4}" text-anchor="end" font-size="11" fill="var(--mu)">${kf(goalV()*f)}</text>`).join('');
 const xl=[CFG.start,...(CFG.weekly||[]).map(w=>w.until)].map(s=>{const i=Math.round((pdt(s)-a)/864e5);return`<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--mu)">${D(s).slice(0,5)}</text>`}).join('');
 return`<div class="card chartc"><div class="legend"><span><i style="background:var(--gold)"></i>Meta acumulada</span><span><i style="background:var(--g2)"></i>Contratado</span><span><i style="background:var(--ok)"></i>Caixa recebido</span></div>
<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Meta acumulada, contratado e caixa recebido ao longo do mês"><defs><linearGradient id="gC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--g2)" stop-opacity=".45"/><stop offset="1" stop-color="var(--g2)" stop-opacity=".02"/></linearGradient><linearGradient id="gR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ok)" stop-opacity=".5"/><stop offset="1" stop-color="var(--ok)" stop-opacity=".02"/></linearGradient></defs>${grid}
<line x1="${pl}" x2="${W-pr}" y1="${y(goalV())}" y2="${y(goalV())}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="2 5"/><text x="${W-pr}" y="${y(goalV())-6}" text-anchor="end" font-size="11" font-weight="700" fill="var(--gold)">Meta ${R(goalV())}</text>
<path d="${ar('c')}" fill="url(#gC)"/><path d="${ar('r')}" fill="url(#gR)"/><path d="${ln('m',n)}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-dasharray="7 5"/>
<path d="${ln('c',tod)}" fill="none" stroke="var(--g2)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="${ln('r',tod)}" fill="none" stroke="var(--ok)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>${lab('c','var(--g2)',-12)}${lab('r','var(--ok)',22)}${xl}</svg></div>`}

function funnel(){const T=CFG?.targets||{},sales=CFG?S.filter(s=>s.status!=='cancelled'&&s.date>=CFG.start&&s.date<=CFG.end).length:0;
 const rows=[['Contatos',fsum('contacts'),T.contacts,'#0b4f8a'],['Conversas reais',fsum('convs'),T.convs,'#1f7fb8'],['Reuniões',fsum('meetings'),T.meetings,'#0a7d55'],['Vendas',sales,T.sales,'#d4af37']];
 return`<div class="card">${rows.map(([l,v,t,c])=>{const p=t?Math.round(v/t*100):0;return`<div class="fr"><div class="fl"><b>${l}</b><span>${v} / ${t||'—'} · ${p}%</span></div><div class="ft"><i style="width:${Math.min(100,p)}%;background:linear-gradient(90deg,${c},color-mix(in srgb,${c} 55%,#fff))"></i></div></div>`}).join('')}</div>`}

function mix(){const l=CFG?.levels||[];if(!l.length)return'';return tbl(['Nível','Implantação','Mensalidade','1ª parcela','Planejado','Fechado','Contratado'],l.map(v=>{const q=okS(CFG.end).filter(s=>s.plan===v.n);return[esc(v.n),R(v.impl),R(v.monthly),R(v.impl+v.monthly),v.qty,q.length,R(q.reduce((a,s)=>a+s.impl+s.monthly,0))]}),[1,2,3,4,5,6])}

const dash0=V.dash;
V.dash=()=>{const h=dash0(),i=h.indexOf('<h3>Last 6 months'),j=h.indexOf('<h3>Overdue'),mid=`${ritmo()}${CFG?`<h3>Evolução da meta no mês</h3>${chart()}<h3>Funil comercial</h3>${funnel()}<h3>Mix de vendas: planejado × fechado</h3>${mix()}`:''}`;return i>0&&j>i?h.slice(0,i)+mid+h.slice(j):h+mid};

V.funil=()=>{if(!CFG)return noCfg;const dl=days(),tg=CFG.daily||{};let acc=0,ns=0;
 const rows=dl.map(s=>{const f=F[s]||{},ss=okS(s).filter(x=>x.date===s),rev=ss.reduce((a,x)=>a+x.impl+x.monthly,0);acc+=rev;ns+=ss.length;
  const inp=k=>`<input type="number" min="0" step="1" class="fi" data-f="${k}" data-d="${s}" value="${f[k]??''}">`;
  return[D(s),WD[pdt(s).getDay()],wk(s),tg.contacts,inp('contacts'),tg.convs,inp('convs'),tg.meetings,inp('meetings'),ss.length,R(rev),R(acc)]});
 const n=dl.length;rows.push(['<b>Total</b>','','',(tg.contacts||0)*n,`<b>${fsum('contacts')}</b>`,(tg.convs||0)*n,`<b>${fsum('convs')}</b>`,(tg.meetings||0)*n,`<b>${fsum('meetings')}</b>`,`<b>${ns}</b>`,'',`<b>${R(acc)}</b>`]);
 return`<p class="sub">Preencha apenas os campos dourados com o que foi feito no dia. Vendas e faturamento vêm das vendas cadastradas.</p>`+tbl(['Data','Dia','Semana','Meta contatos','Contatos feitos','Meta conversas','Conversas feitas','Meta reuniões','Reuniões feitas','Vendas','Faturamento do dia','Faturamento acumulado'],rows,[3,4,5,6,7,8,9,10,11])};

V.leads=()=>`<div class="row" style="margin:0 0 10px"><button class="btn pri" data-a="newLead">+ Novo lead</button></div>`+tbl(['Empresa','Segmento','Telefone','Decisor','Situação','Reunião','Próximo follow-up','Observações',''],[...LD].sort((a,b)=>(a.next||'9')>(b.next||'9')?1:-1).map(l=>[esc(l.company),esc(l.segment),esc(l.phone),esc(l.decisor),`<span class="tag lead">${esc(l.status)}</span>`,D(l.meeting),`<span class="${l.next&&l.next<tz()&&!['Fechado','Perdido'].includes(l.status)?'overdue':''}">${D(l.next)}</span>`,esc(l.notes),`<button class="btn sm" data-a="editLead" data-i="${l.id}">Editar</button>`]));
const leadF=(l={})=>fld('company','Empresa','text',l.company||'')+fld('segment','Segmento','text',l.segment||'')+fld('phone','Telefone','text',l.phone||'')+fld('decisor','Decisor','text',l.decisor||'')+fld('status','Situação','text',l.status||'Novo',LS.map(x=>[x,x]))+fld('meeting','Data da reunião','date',l.meeting||'')+fld('next','Próximo follow-up','date',l.next||'')+fld('notes','Observações','text',l.notes||'');
const saveLead=id=>async v=>{if(!v.company.trim())return'Informe a empresa.';const o={company:v.company.trim(),segment:v.segment,phone:v.phone,decisor:v.decisor,status:v.status,meeting:v.meeting,next:v.next,notes:v.notes},i=id||nid('leads');await put('leads',i,o);await log('lead',i,id?'editado':'criado',`${o.company} · ${o.status}`)};
act.newLead=()=>modal('Novo lead',leadF(),saveLead());
act.editLead=id=>modal('Editar lead',leadF(LD.find(x=>x.id===id)),saveLead(id));

TABS.length=0;TABS.push(['dash','Painel'],['funil','Funil diário'],['sales','Vendas'],['pay','Pagamentos'],['leads','Leads'],['rep','Relatórios'],['aud','Auditoria']);
$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="btn" data-a="tab" data-i="${k}">${l}</button>`).join('');

document.title='Elo Marketing — Painel financeiro e comercial';
const bk=document.createElement('button');bk.className='btn sm';bk.textContent='⬇ Baixar backup';bk.style.marginLeft='auto';bk.onclick=async()=>{try{const dl=await window.claude.use('downloads');if(!dl){bk.textContent='Download indisponível';return}
 const clean=a=>a.map(({id,...r})=>({id,...r})),data={exportadoEm:new Date().toISOString(),config:CFG,vendas:clean(S),pagamentos:clean(P),funil:F,leads:clean(LD),auditoria:clean(E)};
 await dl.save({filename:'backup-elo-marketing-'+tz()+'.json',data:JSON.stringify(data,null,2)});bk.textContent='✔ Backup salvo'}catch(x){bk.textContent='Backup não concluído'}setTimeout(()=>bk.textContent='⬇ Baixar backup',3000)};

 if(t.name==='plan'&&t.tagName==='SELECT'&&CFG){const l=(CFG.levels||[]).find(v=>v.n===t.value),q=n=>$('#dlg [name='+n+']');if(l&&q('impl')){q('impl').value=l.impl;q('monthly').value=l.monthly}}});

function tr(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const t=n.nodeValue,k=t.trim();if(!k)continue;const o=PT[k];if(o!==undefined){n.nodeValue=t.replace(k,o);continue}for(const[r,s]of RX)if(r.test(t)){n.nodeValue=t.replace(r,s);break}}}
const obs=new MutationObserver(()=>{obs.disconnect();tr(document.body);obs.observe(document.body,{childList:true,subtree:true,characterData:true})});
tr(document.body);obs.observe(document.body,{childList:true,subtree:true,characterData:true});
